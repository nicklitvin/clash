<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Clash</title>
<meta name="description" content="A single-player, defense-only village game in neon. Build by day, survive a raid every night.">
<meta name="theme-color" content="#07070f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clash">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/exo2.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="Your village"></canvas>

<div id="hud">
  <div class="top-left">
    <button class="phase" id="phase" aria-label="Village stats" title="Village stats">
      <span class="icon-wrap"><canvas class="ico" id="phaseIcon" width="12" height="12" style="width:26px;height:26px"></canvas></span>
      <span class="phase-text">
        <span class="phase-title" id="phaseTitle">DAY 1</span>
        <span class="phase-sub" id="phaseSub"></span>
      </span>
    </button>
  </div>

  <div class="top-right">
    <div class="res gold" id="resGold" title="Gold">
      <canvas class="ico" data-icon="gold" width="12" height="12"></canvas>
      <div class="track"><div class="fill" id="goldFill"></div><div class="amount ol" id="goldAmt">0</div></div>
      <div class="cap" id="goldCap"></div>
    </div>
    <div class="res elixir" id="resElixir" title="Energy">
      <canvas class="ico" data-icon="elixir" width="12" height="12"></canvas>
      <div class="track"><div class="fill" id="elixirFill"></div><div class="amount ol" id="elixirAmt">0</div></div>
      <div class="cap" id="elixirCap"></div>
    </div>
  </div>

  <!-- Fight on the left; everything for building on the right -->
  <div class="bottom-left">
    <button class="btn war square" id="defendBtn" aria-label="Start the night"><canvas class="ico" data-icon="moon" width="12" height="12" style="width:26px;height:26px"></canvas><span class="sq-label">Fight</span></button>
    <div class="wave square-tile" id="wave" hidden aria-live="polite"><span class="wave-num" id="waveText">0</span><span class="sq-label">Raiders</span></div>
    <button class="btn shop square zoom-btn" id="zoomBtn" aria-label="Zoom: drag left or right" title="Drag left or right to zoom, tap to reset"><canvas class="ico" data-icon="zoom" width="12" height="12" style="width:24px;height:24px"></canvas><span class="sq-label" id="zoomLabel">Zoom</span></button>
  </div>

  <div class="bottom-right">
    <button class="btn round wood" id="speedBtn" hidden aria-label="Game speed">x1</button>
    <button class="btn wood square" id="arrangeBtn" hidden aria-label="Arrange: move or pick up buildings and walls" title="Move or pick up buildings and walls"><canvas class="ico" data-icon="move" width="12" height="12" style="width:24px;height:24px"></canvas><span class="sq-label">Arrange</span></button>
    <button class="btn square shop" id="buildBtn" aria-label="Build: repairs, upgrades and new buildings"><span class="sq-badge" id="buildBadge" hidden>0</span><canvas class="ico" data-icon="hammer" width="12" height="12" style="width:26px;height:26px"></canvas><span class="sq-label" id="buildLabel">Build</span></button>
  </div>

  <div class="bottom-center">
    <div class="sel" id="sel" hidden></div>
    <div class="spells" id="spellBar" hidden aria-label="Spells"></div>
    <div class="place-tip" id="placeTip" hidden></div>
    <div class="inv-bar" id="invBar" hidden aria-label="Buildings to place"></div>
    <div class="place-bar" id="placeBar" hidden>
      <button class="btn no solid" id="placeNo" aria-label="Cancel"><canvas class="ico" data-icon="cross" width="12" height="12" style="width:24px;height:24px"></canvas></button>
      <button class="btn go solid" id="placeOk" aria-label="Confirm"><canvas class="ico" data-icon="check" width="12" height="12" style="width:26px;height:26px"></canvas></button>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast ol" id="toast"></div>

<script src="game.js"></script>
<script>
  // Offline support when served over http(s). Capacitor and Electron load
  // the files locally, so they don't need it.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
